version: "1.0"
owner: "ICRAS Team"
description: "Corporate risk rules and threshold configuration for contract review."

risk_thresholds:
  low:
    min_score: 0
    max_score: 39
  medium:
    min_score: 40
    max_score: 69
  high:
    min_score: 70
    max_score: 89
  critical:
    min_score: 90
    max_score: 100

payment_terms:
  max_payment_days: 30
  medium_risk_days: 60
  high_risk_days: 90
  risk_if_exceeds: "high"
  approver: "finance"

liability_cap:
  required: true
  minimum_cap_type: "contract_value"
  risk_if_missing: "high"
  approver: "legal"

auto_renewal:
  allowed: true
  opt_out_window_required: true
  minimum_opt_out_days: 30
  risk_if_missing: "medium"
  approver: "legal"

gdpr:
  data_processing_clause_required: true
  risk_if_missing: "high"
  approver: "compliance"

required_clauses:
  - "liability"
  - "termination"
  - "confidentiality"
  - "governing_law"
  - "data_processing"

risk_weights:
  payment_terms_exceeded: 25
  missing_required_clause: 30
  missing_liability_cap: 30
  high_risk_jurisdiction: 25
  missing_gdpr_clause: 25
  auto_renewal_without_opt_out: 15
  unknown_vendor: 20